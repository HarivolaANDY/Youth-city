version: '3.8'

# ============================================================
# Youth City - Orchestration Docker Compose Sécurisée (P5)
# Isolation réseau, non-root, limites de ressources & healthchecks
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youthcity-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-youth-city-prod-docker-secret-key-change-me-in-env-file-0923847}
    env_file:
      - path: ./backend/.env
        required: false
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - youthcity-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youthcity-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - youthcity-network

networks:
  youthcity-network:
    driver: bridge
    name: youthcity-bridge-net
