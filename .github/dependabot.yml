# Mises à jour automatiques de dépendances (SEC-01). Les mises à jour de sécurité
# s'activent séparément dans Settings → Code security (voir CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
