name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Contrôles Django
        run: python manage.py check

      - name: Contrôles de déploiement (production)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python manage.py check --deploy --fail-level WARNING

      - name: Tests avec couverture (seuil dans pyproject.toml)
        run: |
          coverage run manage.py test
          coverage report

      - name: Audit des dépendances
        run: pip-audit -r requirements.txt

  # Mêmes tests que le job backend, sur PostgreSQL comme en production (SQLite ignore select_for_update).
  backend-postgres:
    name: Backend (tests PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Migrations sur PostgreSQL
        run: python manage.py migrate --noinput

      - name: Tests sur PostgreSQL
        run: python manage.py test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Types et build de production
        run: npm run build

      - name: Audit des dépendances (niveau élevé)
        run: npm audit --audit-level=high

  # Parcours complet (inscription ➔ cours ➔ premier shift) sur une pile isolée : base SQLite jetable, ports dédiés.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le backend
        run: pip install -r backend/requirements.txt

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci

      - name: Installer Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Contrôle unique à déclarer comme « requis » dans la protection de la branche main.
  ci-success:
    name: ci-success
    if: always()
    needs: [backend, backend-postgres, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le résultat des contrôles
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.backend-postgres.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Au moins un contrôle a échoué ou a été annulé."
            exit 1
          fi
