name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Contrôles Django
        run: python manage.py check

      - name: Contrôles de déploiement (production)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python manage.py check --deploy --fail-level WARNING

      - name: Tests avec couverture (seuil dans pyproject.toml)
        run: |
          coverage run manage.py test
          coverage report

      - name: Audit des dépendances
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Types et build de production
        run: npm run build

      - name: Audit des dépendances (niveau élevé)
        run: npm audit --audit-level=high

  # Contrôle unique à déclarer comme « requis » dans la protection de la branche main.
  ci-success:
    name: ci-success
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le résultat des contrôles
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "Au moins un contrôle a échoué ou a été annulé."
            exit 1
          fi
